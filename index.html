
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050817">
<title>WORLD FIND 4.1 — Живые пространства</title>
<style>
*{box-sizing:border-box}
:root{--accent:#55dfff}
body{
 margin:0;background:#050817;color:white;
 font-family:Arial,sans-serif;height:100dvh;
 overflow:hidden;user-select:none;
}
#scene{
 position:fixed;inset:0;z-index:0;
 background:#071326 center/cover no-repeat;
 transition:background-image .5s ease;
}
#scene:after{
 content:"";position:absolute;inset:0;
 background:linear-gradient(180deg,rgba(3,7,20,.35),rgba(3,7,20,.45) 45%,#030715 100%);
}
#shade{
 position:fixed;inset:0;z-index:1;pointer-events:none;
 background:radial-gradient(circle at center,transparent,rgba(0,0,0,.2));
}
header{
 position:absolute;z-index:5;top:15px;left:15px;right:15px;
 display:flex;justify-content:space-between;align-items:center;
}
.controls{display:flex;gap:9px}
.control{
 border:1px solid #ffffff35;background:#08172bbd;
 color:white;border-radius:18px;padding:11px 14px;
 backdrop-filter:blur(15px);font-size:17px;
}
#placeName{
 position:absolute;z-index:3;top:75px;left:0;right:0;
 text-align:center;font-size:12px;letter-spacing:4px;
 color:#bceeff;text-transform:uppercase;
}
#coreArea{
 position:absolute;z-index:4;left:50%;top:49%;
 transform:translate(-50%,-50%);
 width:280px;height:280px;
 display:grid;place-items:center;
}
#anchor{
 position:absolute;width:230px;height:230px;border-radius:50%;
 border:1px dashed #69dfff60;
 box-shadow:0 0 50px #32caff22,inset 0 0 50px #32caff12;
}
#anchor:before,#anchor:after{
 content:"";position:absolute;border:1px solid #7de7ff25;
 border-radius:50%;inset:22px;
}
#anchor:after{inset:45px}
#core{
 width:105px;height:105px;border-radius:50%;
 position:relative;z-index:3;
 background:radial-gradient(circle at 35% 30%,#fff,#6deaff 15%,#168bda 42%,#071b53 75%);
 box-shadow:0 0 25px #40dfff,0 0 65px #168bff,0 0 120px #168bff55;
 border:1px solid #b7f7ff;
 touch-action:none;
 transition:transform .2s;
}
#core:before{
 content:"";position:absolute;inset:-13px;border-radius:50%;
 border:1px solid #75eaff75;animation:pulse 2.5s infinite;
}
#core:after{
 content:"";position:absolute;inset:-28px;border-radius:50%;
 border:1px solid #75eaff30;animation:pulse 3.5s infinite;
}
@keyframes pulse{50%{transform:scale(1.18);opacity:.2}}
#hint{
 position:absolute;top:calc(50% + 155px);left:0;right:0;
 text-align:center;color:#b9d9ee;font-size:11px;letter-spacing:2px;
}
#menu{
 position:absolute;inset:0;pointer-events:none;
}
.option{
 position:absolute;pointer-events:auto;
 transform:translate(-50%,-50%);
 min-width:91px;text-align:center;
 padding:12px 9px;border-radius:18px;
 border:1px solid #9beaff55;
 background:#07172bdc;backdrop-filter:blur(12px);
 box-shadow:0 0 25px #25baff25;
 font-size:12px;color:white;
 opacity:0;scale:.7;transition:.2s;
}
#menu.active .option{opacity:1;scale:1}
.option.selected{
 background:#0d8fbd;color:white;
 border-color:#aaf5ff;
 box-shadow:0 0 30px #35dfff;
}
.option b{display:block;font-size:22px;margin-bottom:5px}
#search{
 position:absolute;z-index:6;bottom:22px;left:15px;right:15px;
 display:flex;gap:8px;
}
#search input{
 flex:1;min-width:0;border:1px solid #ffffff35;
 background:#07172bdc;color:white;border-radius:25px;
 padding:16px 18px;font-size:14px;outline:none;
 backdrop-filter:blur(15px);
}
#search button{
 border:0;border-radius:50%;width:52px;
 background:#159ed0;color:white;font-size:20px;
}
#panel{
 position:absolute;z-index:8;inset:0;
 display:none;background:#06101bea;
 backdrop-filter:blur(18px);padding:85px 22px 90px;
 overflow:auto;
}
#panel h2{font-size:27px}
#panel p{color:#c4d8e9;line-height:1.6}
#panel button{
 background:#123452;color:white;border:1px solid #5edbff55;
 border-radius:14px;padding:13px 17px;margin:5px;
}
#panel .back{position:absolute;top:20px;left:20px}
#status{
 position:absolute;z-index:3;bottom:90px;left:0;right:0;
 text-align:center;color:#a9d9ed;font-size:10px;letter-spacing:3px;
}
</style>
</head>
<body>
<div id="scene"></div>
<div id="shade"></div>

<header>
 <div class="controls">
  <button class="control" id="sound">♫</button>
  <button class="control" id="more">⋯</button>
 </div>
 <button class="control" id="location">📍 Ош</button>
</header>

<div id="placeName">WORLD FIND · ЖИВОЕ ЯДРО</div>

<div id="coreArea">
 <div id="anchor"></div>
 <div id="core"></div>
 <div id="menu"></div>
</div>

<div id="hint">КОСНИСЬ ЯДРА И ВЫБЕРИ НАПРАВЛЕНИЕ</div>
<div id="status">ONE PLANET · MANY POSSIBILITIES</div>

<div id="search">
 <input id="searchInput" placeholder="Найти что угодно в мире...">
 <button id="searchButton">⌕</button>
</div>

<div id="panel">
 <button class="back" id="back">← Назад</button>
 <h2 id="panelTitle"></h2>
 <p id="panelText"></p>
 <div id="panelContent"></div>
</div>

<script>
const spaces=[
 {id:"map",name:"Карта мира",icon:"🌍",image:"https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=1600&q=85",text:"Исследуй города, страны, места и маршруты."},
 {id:"market",name:"Товары и магазины",icon:"🛍️",image:"https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=1600&q=85",text:"Находи товары, магазины, цены и доступность."},
 {id:"services",name:"Услуги",icon:"🛠️",image:"https://images.unsplash.com/photo-1497366754035-f200968a6e72?w=1600&q=85",text:"Специалисты, компании и услуги рядом."},
 {id:"work",name:"Работа и задания",icon:"💼",image:"https://images.unsplash.com/photo-1497366216548-37526070297c?w=1600&q=85",text:"Работа, проекты, заказы и возможности."},
 {id:"learn",name:"Обучение",icon:"🎓",image:"https://images.unsplash.com/photo-1509062522246-3755977927d7?w=1600&q=85",text:"Обучение, знания, курсы и развитие."},
 {id:"community",name:"Сообщества",icon:"👥",image:"https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=1600&q=85",text:"Люди, города, общение и совместные инициативы."},
 {id:"delivery",name:"Доставка",icon:"🚚",image:"https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?w=1600&q=85",text:"Заказы, доставка и отслеживание."},
 {id:"profile",name:"Профиль",icon:"👤",image:"https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=1600&q=85",text:"Твой профиль и личные настройки."}
];

const scene=document.getElementById("scene");
const core=document.getElementById("core");
const menu=document.getElementById("menu");
const panel=document.getElementById("panel");
const title=document.getElementById("panelTitle");
const description=document.getElementById("panelText");
const content=document.getElementById("panelContent");
const placeName=document.getElementById("placeName");
const hint=document.getElementById("hint");

let active=false;
let selected=-1;
let currentSpace=null;
let pointerDown=false;

function setBackground(url){
 scene.style.backgroundImage=`url("${url}")`;
}
setBackground(spaces[0].image);

function buildMenu(){
 menu.innerHTML="";
 spaces.forEach((space,i)=>{
  const angle=(-90+i*45)*Math.PI/180;
  const x=140+Math.cos(angle)*115;
  const y=140+Math.sin(angle)*115;
  const item=document.createElement("div");
  item.className="option";
  item.style.left=x+"px";
  item.style.top=y+"px";
  item.innerHTML=`<b>${space.icon}</b>${space.name}`;
  item.addEventListener("pointerdown",e=>{
   e.preventDefault();
   openSpace(i);
  });
  menu.appendChild(item);
 });
}
buildMenu();

function showMenu(){
 active=true;
 menu.classList.add("active");
 hint.textContent="ВЫБЕРИ ОДНО ИЗ НАПРАВЛЕНИЙ";
}
function hideMenu(){
 active=false;
 menu.classList.remove("active");
 selected=-1;
}
core.addEventListener("pointerdown",e=>{
 e.preventDefault();
 pointerDown=true;
 core.setPointerCapture(e.pointerId);
 showMenu();
});
core.addEventListener("pointermove",e=>{
 if(!pointerDown)return;
 const rect=document.getElementById("coreArea").getBoundingClientRect();
 const cx=rect.left+rect.width/2;
 const cy=rect.top+rect.height/2;
 const dx=e.clientX-cx;
 const dy=e.clientY-cy;
 if(Math.hypot(dx,dy)<38){selected=-1;return;}
 let angle=Math.atan2(dy,dx)*180/Math.PI;
 selected=(Math.round((angle+90+360)%360/45))%8;
 [...menu.children].forEach((el,i)=>{
  el.classList.toggle("selected",i===selected);
 });
});
core.addEventListener("pointerup",()=>{
 pointerDown=false;
 if(selected>=0)openSpace(selected);
 else hideMenu();
});
core.addEventListener("pointercancel",()=>{
 pointerDown=false;hideMenu();
});

function openSpace(index){
 const space=spaces[index];
 currentSpace=space;
 hideMenu();
 setBackground(space.image);
 placeName.textContent=space.name.toUpperCase();
 title.textContent=space.icon+" "+space.name;
 description.textContent=space.text;
 content.innerHTML=`
 <p>Пространство WORLD FIND</p>
 <p>Здесь будет работать поиск, реальные данные, предложения и взаимодействие пользователей.</p>
 <button onclick="backHome()">На главную</button>`;
 panel.style.display="block";
 hint.textContent="ПРОСТРАНСТВО ОТКРЫТО";
}
function backHome(){
 panel.style.display="none";
 currentSpace=null;
 setBackground(spaces[0].image);
 placeName.textContent="WORLD FIND · ЖИВОЕ ЯДРО";
 hint.textContent="КОСНИСЬ ЯДРА И ВЫБЕРИ НАПРАВЛЕНИЕ";
}
document.getElementById("back").onclick=backHome;
document.getElementById("location").onclick=()=>{
 const city=prompt("Введи город или регион","Ош");
 if(city){
  document.getElementById("location").textContent="📍 "+city;
  if(currentSpace)placeName.textContent=(currentSpace.name+" · "+city).toUpperCase();
 }
};
document.getElementById("more").onclick=()=>{
 title.textContent="Меню WORLD FIND";
 description.textContent="Дополнительные возможности платформы.";
 content.innerHTML="<p>Настройки · Помощь · О проекте · Язык</p>";
 panel.style.display="block";
};
document.getElementById("sound").onclick=()=>{
 const b=document.getElementById("sound");
 b.textContent=b.textContent==="♫"?"🔇":"♫";
};
function search(){
 const value=document.getElementById("searchInput").value.trim();
 if(!value)return;
 title.textContent="Поиск";
 description.textContent="Запрос: "+value;
 content.innerHTML="<p>Демонстрационный режим. Подключение реального глобального поиска будет следующим этапом.</p>";
 panel.style.display="block";
}
document.getElementById("searchButton").onclick=search;
document.getElementById("searchInput").addEventListener("keydown",e=>{
 if(e.key==="Enter")search();
});
</script>
</body>
</html>
