
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#050914">
<title>WORLD FIND — Живое ядро</title>

<style>
:root {
  --bg:#050914;
  --panel:rgba(12,24,44,.94);
  --blue:#55d8ff;
  --cyan:#75f5ff;
  --purple:#9b75ff;
  --text:#e9f7ff;
  --muted:#829bb8;
}

* { box-sizing:border-box; }

body {
  margin:0;
  min-height:100vh;
  min-height:100dvh;
  overflow:hidden;
  color:var(--text);
  background:
    radial-gradient(ellipse at 50% 43%, #142746 0%, #091326 38%, #050914 78%);
  font-family:Arial, sans-serif;
}

button,input { font:inherit; }
button { color:inherit; }

.app {
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  position:relative;
  overflow:hidden;
}

.stars {
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.5;
  background-image:
    radial-gradient(2px 2px at 15% 20%,#9deaff 50%,transparent),
    radial-gradient(1px 1px at 80% 15%,#fff 50%,transparent),
    radial-gradient(2px 2px at 75% 75%,#8b9dff 50%,transparent),
    radial-gradient(1px 1px at 20% 80%,#fff 50%,transparent),
    radial-gradient(1px 1px at 50% 10%,#fff 50%,transparent),
    radial-gradient(2px 2px at 90% 48%,#78dfff 50%,transparent);
  background-size:270px 250px;
}

header {
  height:65px;
  padding:0 19px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  z-index:5;
  border-bottom:1px solid rgba(120,190,255,.08);
}

.logo {
  font-size:15px;
  letter-spacing:3px;
  font-weight:700;
}

.logo span { color:var(--blue); }

.header-actions {
  display:flex;
  gap:10px;
}

.icon-button {
  width:39px;
  height:39px;
  border-radius:50%;
  border:1px solid rgba(119,203,255,.2);
  background:rgba(17,36,62,.65);
  display:grid;
  place-items:center;
  color:#a8eaff;
  cursor:pointer;
}

.icon-button:active { transform:scale(.93); }

main {
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  padding:8px 14px 18px;
  z-index:2;
}

.intro {
  text-align:center;
  margin-bottom:5px;
}

.intro h1 {
  font-size:clamp(19px,5vw,25px);
  letter-spacing:5px;
  margin:0 0 7px;
  font-weight:500;
}

.intro p {
  font-size:11px;
  color:var(--muted);
  letter-spacing:2px;
  margin:0;
}

.universe {
  width:min(92vw,410px);
  height:min(92vw,410px);
  max-height:48vh;
  position:relative;
  flex-shrink:0;
  touch-action:none;
}

.orbit {
  position:absolute;
  left:50%;
  top:50%;
  width:66%;
  height:66%;
  border:1px solid rgba(83,194,255,.13);
  border-radius:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
}

.orbit.two {
  width:85%;
  height:85%;
  border-color:rgba(145,112,255,.12);
}

.orbit.three {
  width:99%;
  height:99%;
  border-style:dashed;
  border-color:rgba(83,194,255,.09);
  animation:orbit 45s linear infinite;
}

@keyframes orbit {
  to { transform:translate(-50%,-50%) rotate(360deg); }
}

.direction {
  position:absolute;
  width:83px;
  min-height:57px;
  border:1px solid rgba(103,193,255,.19);
  border-radius:15px;
  background:rgba(12,30,53,.82);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:4px;
  color:#b9d9f0;
  font-size:11px;
  transition:.2s;
  z-index:2;
  cursor:pointer;
  user-select:none;
}

.direction .symbol {
  font-size:19px;
  color:#80dcff;
}

.direction.active {
  border-color:#79eaff;
  background:rgba(34,105,145,.5);
  box-shadow:0 0 24px rgba(64,208,255,.35);
  color:white;
  transform:scale(1.08);
}

.d-map { left:50%; top:0; transform:translateX(-50%); }
.d-market { right:0; top:50%; transform:translateY(-50%); }
.d-services { left:0; top:50%; transform:translateY(-50%); }
.d-work { left:50%; bottom:0; transform:translateX(-50%); }

.d-delivery { right:7%; top:12%; }
.d-learn { left:7%; top:12%; }
.d-business { right:7%; bottom:12%; }
.d-ai { left:7%; bottom:12%; }

.d-map.active { transform:translateX(-50%) scale(1.08); }
.d-market.active,.d-services.active { transform:translateY(-50%) scale(1.08); }
.d-work.active { transform:translateX(-50%) scale(1.08); }

.core-wrap {
  position:absolute;
  left:50%;
  top:50%;
  width:112px;
  height:112px;
  transform:translate(-50%,-50%);
  z-index:4;
  display:grid;
  place-items:center;
}

.core-halo {
  position:absolute;
  width:100%;
  height:100%;
  border-radius:50%;
  background:radial-gradient(circle,rgba(42,186,255,.2),rgba(112,78,255,.08) 55%,transparent 72%);
  animation:breathe 3s ease-in-out infinite;
  pointer-events:none;
}

.core {
  position:relative;
  width:68px;
  height:68px;
  border:1px solid rgba(153,236,255,.8);
  border-radius:50%;
  background:
    radial-gradient(circle at 36% 30%,#e4ffff 0%,#71eaff 9%,#267bc1 30%,#16275e 58%,#080d27 78%);
  box-shadow:
    0 0 13px #4ddaff,
    0 0 32px rgba(57,173,255,.75),
    inset 0 0 17px rgba(140,240,255,.8);
  cursor:grab;
  touch-action:none;
  display:grid;
  place-items:center;
  transition:box-shadow .2s;
}

.core:active { cursor:grabbing; }

.core::before {
  content:"";
  position:absolute;
  inset:-9px;
  border:1px solid rgba(102,221,255,.35);
  border-radius:50%;
  animation:spin 8s linear infinite;
}

.core::after {
  content:"";
  position:absolute;
  inset:-17px;
  border:1px dashed rgba(151,121,255,.28);
  border-radius:50%;
  animation:spin 14s linear infinite reverse;
}

.core.dragging {
  box-shadow:0 0 24px #6cecff,0 0 55px #596eff;
}

.core-dot {
  width:13px;
  height:13px;
  background:#efffff;
  border-radius:50%;
  box-shadow:0 0 18px white,0 0 35px #63dfff;
}

@keyframes breathe {
  50% { transform:scale(1.25); opacity:.65; }
}

@keyframes spin {
  to { transform:rotate(360deg); }
}

.instruction {
  color:#8ba8c4;
  font-size:11px;
  text-align:center;
  margin:0 0 12px;
  letter-spacing:.5px;
}

.search {
  width:min(92%,410px);
  height:51px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 15px;
  border:1px solid rgba(101,196,255,.25);
  background:rgba(13,29,51,.9);
  border-radius:17px;
  box-shadow:0 8px 30px rgba(0,0,0,.2);
}

.search span {
  font-size:19px;
  color:#80dfff;
}

.search input {
  width:100%;
  border:0;
  outline:0;
  color:white;
  background:transparent;
  font-size:13px;
}

.search input::placeholder { color:#7792ad; }

.search button {
  border:0;
  background:transparent;
  color:#80dfff;
  font-size:19px;
  cursor:pointer;
}

.status {
  color:#718ca8;
  font-size:10px;
  margin-top:12px;
  text-align:center;
}

footer {
  padding:8px 15px 15px;
  text-align:center;
  color:#607d9b;
  font-size:10px;
  letter-spacing:1px;
  z-index:2;
}

.panel {
  position:fixed;
  inset:0;
  z-index:10;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(2,7,17,.78);
  backdrop-filter:blur(12px);
}

.panel.show { display:flex; }

.panel-card {
  width:min(100%,430px);
  max-height:85vh;
  overflow:auto;
  border:1px solid rgba(108,206,255,.25);
  background:linear-gradient(145deg,#122744,#081326);
  border-radius:23px;
  padding:22px;
  box-shadow:0 0 50px rgba(35,138,255,.13);
}

.panel-top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.panel-top h2 {
  font-size:19px;
  font-weight:500;
  margin:0;
}

.close {
  width:34px;
  height:34px;
  border-radius:50%;
  border:1px solid #34516e;
  background:#132b48;
  cursor:pointer;
}

.panel-description {
  color:#a3bdd5;
  font-size:13px;
  line-height:1.6;
}

.panel-list {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:16px;
}

.panel-item {
  border:1px solid rgba(111,190,255,.17);
  background:rgba(18,43,70,.7);
  border-radius:13px;
  padding:13px 9px;
  text-align:left;
  cursor:pointer;
  font-size:12px;
}

.panel-item span {
  display:block;
  font-size:19px;
  margin-bottom:6px;
}

.result {
  border-bottom:1px solid rgba(130,190,255,.13);
  padding:12px 0;
  font-size:13px;
}

.result small {
  display:block;
  color:#8ca8c4;
  margin-top:5px;
}

.text-input {
  width:100%;
  padding:13px;
  border:1px solid #345779;
  background:#09182c;
  color:white;
  border-radius:12px;
  outline:0;
  margin-top:10px;
}

.action {
  border:1px solid rgba(111,208,255,.3);
  background:#164269;
  border-radius:12px;
  padding:12px 16px;
  margin-top:12px;
  cursor:pointer;
}

.toast {
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  opacity:0;
  pointer-events:none;
  background:#173451;
  border:1px solid #4a9bc2;
  border-radius:12px;
  padding:11px 16px;
  font-size:12px;
  z-index:20;
  transition:.25s;
  text-align:center;
  width:max-content;
  max-width:90%;
}

.toast.show {
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

@media(max-height:700px) {
  .intro { margin-top:2px; }
  .universe { width:min(84vw,340px); height:min(84vw,340px); }
  .core-wrap { width:96px;height:96px; }
  .core { width:59px;height:59px; }
  .direction { width:73px;min-height:49px;font-size:10px; }
  .search { height:46px; }
  footer { padding-bottom:8px; }
}

@media(min-width:700px) {
  .universe { width:410px;height:410px; }
}
</style>
</head>

<body>
<div class="app">
<div class="stars"></div>

<header>
  <div class="logo">WORLD <span>FIND</span></div>
  <div class="header-actions">
    <button class="icon-button" id="soundButton" aria-label="Звук">♪</button>
    <button class="icon-button" id="locationButton" aria-label="Местоположение">⌖</button>
    <button class="icon-button" id="moreButton" aria-label="Дополнительно">•••</button>
  </div>
</header>

<main>
  <div class="intro">
    <h1>ЖИВОЕ ЯДРО</h1>
    <p>ОДИН МИР · МНОГО ВОЗМОЖНОСТЕЙ</p>
  </div>

  <div class="universe" id="universe">
    <div class="orbit"></div>
    <div class="orbit two"></div>
    <div class="orbit three"></div>

    <button class="direction d-map" data-id="map">
      <span class="symbol">◎</span>Карта
    </button>
    <button class="direction d-market" data-id="market">
      <span class="symbol">◇</span>Товары
    </button>
    <button class="direction d-services" data-id="services">
      <span class="symbol">⚙</span>Услуги
    </button>
    <button class="direction d-work" data-id="work">
      <span class="symbol">▣</span>Работа
    </button>
    <button class="direction d-delivery" data-id="delivery">
      <span class="symbol">⇢</span>Доставка
    </button>
    <button class="direction d-learn" data-id="learn">
      <span class="symbol">⌘</span>Обучение
    </button>
    <button class="direction d-business" data-id="business">
      <span class="symbol">▤</span>Бизнес
    </button>
    <button class="direction d-ai" data-id="ai">
      <span class="symbol">✧</span>ИИ
    </button>

    <div class="core-wrap" id="coreWrap">
      <div class="core-halo"></div>
      <div class="core" id="core" role="button" aria-label="Переместить живое ядро">
        <div class="core-dot"></div>
      </div>
    </div>
  </div>

  <p class="instruction" id="instruction">
    Перемещай ядро в сторону нужного направления
  </p>

  <form class="search" id="searchForm">
    <span>⌕</span>
    <input id="searchInput" type="search"
      placeholder="Что ты ищешь в этом мире?"
      autocomplete="off">
    <button type="submit" aria-label="Искать">➜</button>
  </form>

  <div class="status" id="cityStatus">⌖ Ош · Кыргызстан</div>
</main>

<footer>ONE PLANET · MANY POSSIBILITIES</footer>
</div>

<div class="panel" id="panel">
  <div class="panel-card">
    <div class="panel-top">
      <h2 id="panelTitle">WORLD FIND</h2>
      <button class="close" id="closePanel">×</button>
    </div>
    <div id="panelContent"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Существующая архитектура проекта -->
<div data-wf-outlet hidden></div>
<script src="core.js"></script>
<script src="page-catalog.js"></script>
<script src="integration.js"></script>

<script>
(() => {
"use strict";

const core = document.getElementById("core");
const coreWrap = document.getElementById("coreWrap");
const universe = document.getElementById("universe");
const directions = [...document.querySelectorAll(".direction")];
const panel = document.getElementById("panel");
const panelTitle = document.getElementById("panelTitle");
const panelContent = document.getElementById("panelContent");
const instruction = document.getElementById("instruction");
const toast = document.getElementById("toast");

const sections = {
  map: {
    title:"Карта мира",
    description:"Исследуй города, районы, магазины, места и предложения вокруг себя.",
    items:["🌍 Исследовать мир","📍 Места рядом","🏙 Города","🗺 Районы"]
  },
  market: {
    title:"Товары",
    description:"Поиск товаров, магазинов, поставщиков и доступных предложений.",
    items:["🛍 Все товары","🏪 Магазины","📦 Предложения","🤝 Поставщики"]
  },
  services: {
    title:"Услуги",
    description:"Находи специалистов и услуги в нужном городе или районе.",
    items:["🔧 Мастера","🧹 Бытовые услуги","💻 Онлайн-услуги","👨‍🔧 Специалисты"]
  },
  work: {
    title:"Работа и задания",
    description:"Ищи работу, исполнителей, временные задания и проекты.",
    items:["💼 Вакансии","📝 Задания","🧑‍💻 Удалённая работа","🤝 Исполнители"]
  },
  delivery: {
    title:"Доставка",
    description:"Будущее пространство заказов, доставки и отслеживания. Реальные службы пока не подключены.",
    items:["🚚 Заказы","📍 Отслеживание","🏍 Курьеры","📦 Мои доставки"]
  },
  learn: {
    title:"Обучение",
    description:"Образование, курсы, навыки, наставники и учебные материалы.",
    items:["📚 Курсы","🎓 Образование","🧠 Навыки","👨‍🏫 Наставники"]
  },
  business: {
    title:"Бизнес",
    description:"Инструменты для компаний, предпринимателей и партнёров.",
    items:["🏢 Компании","🤝 Партнёры","📊 Инструменты","📣 Продвижение"]
  },
  ai: {
    title:"ИИ-помощник",
    description:"Помощь в поиске, выборе направления и формулировке запросов. Интеллектуальный сервис будет подключён отдельно.",
    items:["✧ Помочь найти","✧ Сформировать запрос","✧ Подобрать направление","✧ Мои запросы"]
  }
};

let selected = null;
let dragging = false;
let startX = 0;
let startY = 0;
let currentX = 0;
let currentY = 0;
let soundEnabled = false;
let city = "Ош";
let toastTimer;

function notify(message) {
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"),2400);
}

function selectDirection(id) {
  selected = id;
  directions.forEach(button => {
    button.classList.toggle("active",button.dataset.id === id);
  });

  instruction.textContent = id
    ? "Выбрано: " + sections[id].title + " · отпусти ядро"
    : "Перемещай ядро в сторону нужного направления";
}

function detectDirection(dx,dy) {
  const distance = Math.hypot(dx,dy);
  if(distance < 35) return null;

  const angle = Math.atan2(-dy,dx) * 180 / Math.PI;
  const normalized = (angle + 360) % 360;

  if(normalized >= 67.5 && normalized < 112.5) return "map";
  if(normalized >= 22.5 && normalized < 67.5) return "delivery";
  if(normalized >= 337.5 || normalized < 22.5) return "market";
  if(normalized >= 247.5 && normalized < 292.5) return "work";
  if(normalized >= 202.5 && normalized < 247.5) return "business";
  if(normalized >= 157.5 && normalized < 202.5) return "services";
  if(normalized >= 112.5 && normalized < 157.5) return "learn";
  return "ai";
}

function resetCore() {
  core.style.transform = "";
  core.classList.remove("dragging");
  coreWrap.style.transform = "translate(-50%,-50%)";
  dragging = false;
}

core.addEventListener("pointerdown", event => {
  dragging = true;
  startX = event.clientX;
  startY = event.clientY;
  currentX = 0;
  currentY = 0;
  selected = null;
  core.classList.add("dragging");
  core.setPointerCapture(event.pointerId);
});

core.addEventListener("pointermove", event => {
  if(!dragging) return;

  currentX = event.clientX - startX;
  currentY = event.clientY - startY;

  const maxMove = 105;
  const distance = Math.hypot(currentX,currentY);
  if(distance > maxMove) {
    const factor = maxMove / distance;
    currentX *= factor;
    currentY *= factor;
  }

  core.style.transform =
    `translate(${currentX}px,${currentY}px)`;

  const id = detectDirection(currentX,currentY);
  selectDirection(id);
});

core.addEventListener("pointerup", () => {
  if(!dragging) return;
  const destination = selected;
  resetCore();

  if(destination) openSection(destination);
  else {
    selectDirection(null);
    instruction.textContent = "Перемещай ядро в сторону нужного направления";
  }
});

core.addEventListener("pointercancel", () => {
  resetCore();
  selectDirection(null);
});

directions.forEach(button => {
  button.addEventListener("click",() => {
    openSection(button.dataset.id);
  });
});

function openSection(id) {
  const section = sections[id];
  if(!section) return;

  selectDirection(id);
  panelTitle.textContent = section.title;

  panelContent.innerHTML = `
    <p class="panel-description">${section.description}</p>
    <div class="panel-list">
      ${section.items.map(item =>
        `<button class="panel-item" type="button">${item}</button>`
      ).join("")}
    </div>
    <p class="panel-description" style="margin-top:17px">
      WORLD FIND · Раздел демонстрационного прототипа
    </p>
  `;

  panelContent.querySelectorAll(".panel-item").forEach(button => {
    button.addEventListener("click",() => {
      notify("Это направление пока находится в разработке");
    });
  });

  panel.classList.add("show");
}

function closePanel() {
  panel.classList.remove("show");
  selectDirection(null);
}

document.getElementById("closePanel").addEventListener("click",closePanel);

panel.addEventListener("click",event => {
  if(event.target === panel) closePanel();
});

document.getElementById("moreButton").addEventListener("click",() => {
  panelTitle.textContent = "Дополнительные возможности";
  panelContent.innerHTML = `
    <div class="panel-list">
      <button class="panel-item" data-action="profile"><span>👤</span>Профиль</button>
      <button class="panel-item" data-action="messages"><span>💬</span>Сообщения</button>
      <button class="panel-item" data-action="settings"><span>⚙</span>Настройки</button>
      <button class="panel-item" data-action="about"><span>🌐</span>О проекте</button>
    </div>
  `;
  panelContent.querySelectorAll("[data-action]").forEach(button => {
    button.addEventListener("click",() => {
      notify("Раздел " + button.textContent.trim() + " готовится");
    });
  });
  panel.classList.add("show");
});

document.getElementById("soundButton").addEventListener("click",event => {
  soundEnabled = !soundEnabled;
  event.currentTarget.textContent = soundEnabled ? "♫" : "♪";
  notify(soundEnabled ? "Звуковой режим включён" : "Звуковой режим выключен");
});

document.getElementById("locationButton").addEventListener("click",() => {
  panelTitle.textContent = "Местоположение";
  panelContent.innerHTML = `
