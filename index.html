
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#050914">
<title>WORLD FIND — Living Core</title>

<style>
:root {
  --bg:#050914;
  --blue:#55cfff;
  --cyan:#8af5ff;
  --purple:#9875ff;
  --white:#eaf7ff;
  --muted:#8ca4bd;
}
* {box-sizing:border-box}
body {
  margin:0;
  min-height:100vh;
  min-height:100dvh;
  overflow:hidden;
  color:var(--white);
  font-family:Inter,Arial,sans-serif;
  background:
    radial-gradient(ellipse at 50% 45%,#142844 0%,#0a1528 36%,#050914 76%);
}
button,input {font:inherit}
button {color:inherit}
.app {
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  position:relative;
  isolation:isolate;
}
.ambient {
  position:absolute;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background:
    radial-gradient(circle at 18% 22%,rgba(68,143,255,.10),transparent 25%),
    radial-gradient(circle at 83% 72%,rgba(136,83,255,.09),transparent 26%);
}
header {
  height:66px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 19px;
  border-bottom:1px solid rgba(130,190,255,.09);
}
.brand {
  font-size:14px;
  font-weight:700;
  letter-spacing:3px;
}
.brand span {color:var(--blue)}
.top-actions {display:flex;gap:9px}
.top-button {
  width:39px;height:39px;
  border-radius:50%;
  border:1px solid rgba(120,205,255,.19);
  background:rgba(17,34,58,.65);
  color:#a8e9ff;
  cursor:pointer;
  font-size:17px;
}
main {
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:12px 15px 18px;
}
.heading {
  text-align:center;
  margin-bottom:5px;
}
.heading h1 {
  font-size:clamp(18px,5vw,23px);
  letter-spacing:5px;
  font-weight:500;
  margin:0 0 8px;
}
.heading p {
  color:var(--muted);
  font-size:10px;
  letter-spacing:2px;
  margin:0;
}
.stage {
  width:min(94vw,430px);
  height:min(94vw,430px);
  max-height:48vh;
  min-height:285px;
  position:relative;
  flex-shrink:0;
  touch-action:pan-y;
}
.ring {
  position:absolute;
  left:50%;top:50%;
  transform:translate(-50%,-50%);
  border:1px solid rgba(93,194,255,.12);
  border-radius:50%;
  pointer-events:none;
}
.ring.one {width:46%;height:46%}
.ring.two {width:69%;height:69%;border-color:rgba(142,115,255,.12)}
.ring.three {
  width:94%;height:94%;
  border-style:dashed;
  border-color:rgba(100,187,255,.09);
}
.axis {
  position:absolute;
  left:50%;top:50%;
  width:78%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(97,192,255,.14),transparent);
  transform:translate(-50%,-50%);
  pointer-events:none;
}
.axis.vertical {
  width:1px;height:78%;
  background:linear-gradient(transparent,rgba(97,192,255,.14),transparent);
}
.core-position {
  position:absolute;
  left:50%;top:50%;
  width:100px;height:100px;
  transform:translate(-50%,-50%);
  z-index:5;
  display:grid;
  place-items:center;
}
.core-glow {
  position:absolute;
  width:100%;height:100%;
  border-radius:50%;
  background:radial-gradient(circle,rgba(69,209,255,.28),rgba(126,91,255,.10) 48%,transparent 72%);
  animation:glow 3.5s ease-in-out infinite;
  pointer-events:none;
}
.core {
  width:66px;height:66px;
  border:1px solid rgba(166,245,255,.8);
  border-radius:50%;
  position:relative;
  cursor:grab;
  touch-action:none;
  display:grid;
  place-items:center;
  background:
    radial-gradient(circle at 34% 28%,#eaffff 0%,#8af4ff 5%,#39b9ee 19%,#225baf 43%,#292568 68%,#080e2a 100%);
  box-shadow:
    0 0 12px rgba(80,218,255,.9),
    0 0 30px rgba(61,171,255,.65),
    0 0 55px rgba(126,91,255,.28),
    inset 0 0 17px rgba(187,250,255,.55);
  transition:box-shadow .2s;
}
.core:before,.core:after {
  content:"";
  position:absolute;
  border-radius:50%;
  pointer-events:none;
}
.core:before {
  inset:-8px;
  border:1px solid rgba(100,222,255,.38);
  border-left-color:transparent;
  transform:rotate(-35deg);
}
.core:after {
  inset:-14px;
  border:1px dashed rgba(162,133,255,.35);
}
.core.dragging {
  cursor:grabbing;
  box-shadow:0 0 24px #8af5ff,0 0 60px #597dff;
}
.core-light {
  width:11px;height:11px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 14px white,0 0 28px #8af5ff;
}
@keyframes glow {
  50% {transform:scale(1.15);opacity:.72}
}
.function {
  position:absolute;
  width:91px;
  min-height:54px;
  padding:6px 4px;
  border-radius:14px;
  border:1px solid rgba(115,196,255,.17);
  background:rgba(10,27,49,.84);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:3px;
  font-size:10px;
  color:#bfd8ee;
  opacity:0;
  transform:scale(.75);
  pointer-events:none;
  transition:opacity .25s,transform .25s,border-color .2s,background .2s;
  z-index:3;
  cursor:pointer;
  backdrop-filter:blur(9px);
}
.function .symbol {font-size:18px;color:#83e4ff}
.stage.open .function {
  opacity:1;
  transform:scale(1);
  pointer-events:auto;
}
.function.active {
  border-color:#80eaff;
  background:rgba(34,91,132,.9);
  box-shadow:0 0 22px rgba(69,205,255,.3);
}
.f-map {left:50%;top:1%;transform:translateX(-50%) scale(.75)}
.f-market {right:0;top:50%;transform:translateY(-50%) scale(.75)}
.f-services {left:0;top:50%;transform:translateY(-50%) scale(.75)}
.f-work {left:50%;bottom:1%;transform:translateX(-50%) scale(.75)}
.f-delivery {right:5%;top:12%}
.f-learn {left:5%;top:12%}
.f-business {right:5%;bottom:12%}
.f-ai {left:5%;bottom:12%}
.stage.open .f-map {transform:translateX(-50%) scale(1)}
.stage.open .f-market,.stage.open .f-services {transform:translateY(-50%) scale(1)}
.stage.open .f-work {transform:translateX(-50%) scale(1)}
.stage.open .function:active {transform:scale(.94)}
.stage.open .f-map:active,.stage.open .f-work:active {transform:translateX(-50%) scale(.94)}
.stage.open .f-market:active,.stage.open .f-services:active {transform:translateY(-50%) scale(.94)}
.hint {
  color:#91abc4;
  font-size:11px;
  text-align:center;
  margin:0 0 14px;
  min-height:15px;
}
.search {
  width:min(94%,410px);
  height:52px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 15px;
  border:1px solid rgba(103,199,255,.24);
  background:rgba(12,28,49,.9);
  border-radius:17px;
  box-shadow:0 10px 35px rgba(0,0,0,.2);
}
.search-icon {font-size:20px;color:#83e4ff}
.search input {
  flex:1;min-width:0;
  border:0;outline:0;
  background:transparent;
  color:white;
  font-size:13px;
}
.search input::placeholder {color:#829bb4}
.search button {
  border:0;background:transparent;
  color:#8aeaff;font-size:19px;
}
.city {
  margin-top:12px;
  color:#819bb5;
  font-size:10px;
}
footer {
  text-align:center;
  padding:8px 12px 14px;
  color:#66819d;
  font-size:9px;
  letter-spacing:2px;
}
.overlay {
  position:fixed;inset:0;
  z-index:10;
  display:none;
  align-items:center;justify-content:center;
  padding:18px;
  background:rgba(2,7,17,.78);
  backdrop-filter:blur(13px);
}
.overlay.show {display:flex}
.dialog {
  width:min(100%,430px);
  max-height:82vh;
  overflow:auto;
  border:1px solid rgba(112,202,255,.25);
  border-radius:23px;
  padding:22px;
  background:linear-gradient(145deg,#142b49,#081326);
  box-shadow:0 0 55px rgba(47,139,255,.14);
}
.dialog-head {
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:15px;
}
.dialog h2 {font-size:19px;font-weight:500;margin:0}
.close {
  width:34px;height:34px;border-radius:50%;
  border:1px solid #385675;background:#102642;
  cursor:pointer;font-size:20px;
}
.description {font-size:13px;line-height:1.6;color:#a9c1d8}
.items {
  display:grid;grid-template-columns:1fr 1fr;
  gap:9px;margin-top:15px;
}
.item {
  padding:13px 10px;
  text-align:left;
  border-radius:13px;
  border:1px solid rgba(120,195,255,.17);
  background:rgba(20,46,75,.75);
  font-size:12px;cursor:pointer;
}
.item span {display:block;font-size:19px;margin-bottom:6px}
.text-input {
  width:100%;padding:13px;margin-top:10px;
  color:white;background:#09182c;
  border:1px solid #365779;border-radius:12px;
}
.action {
  padding:12px 15px;margin-top:12px;
  border:1px solid rgba(111,208,255,.3);
  border-radius:12px;background:#164269;cursor:pointer;
}
.toast {
  position:fixed;z-index:20;
  bottom:24px;left:50%;
  transform:translate(-50%,15px);
  opacity:0;pointer-events:none;
  padding:11px 16px;border-radius:12px;
  background:#173451;border:1px solid #4a9bc2;
  font-size:12px;transition:.2s;
  max-width:90%;text-align:center;
}
.toast.show {opacity:1;transform:translate(-50%,0)}
@media(max-height:690px) {
  .heading {margin-bottom:0}
  .stage {width:min(84vw,350px);height:min(84vw,350px);min-height:260px}
  .function {width:79px;min-height:48px;font-size:9px}
  .core-position {width:88px;height:88px}
  .core {width:59px;height:59px}
  .search {height:46px}
  footer {padding-bottom:7px}
}
</style>
</head>

<body>
<div class="app">
<div class="ambient"></div>

<header>
  <div class="brand">WORLD <span>FIND</span></div>
  <div class="top-actions">
    <button class="top-button" id="sound" aria-label="Звук">♫</button>
    <button class="top-button" id="location" aria-label="Местоположение">⌖</button>
    <button class="top-button" id="more" aria-label="Меню">•••</button>
  </div>
</header>

<main>
  <div class="heading">
    <h1>ЖИВОЕ ЯДРО</h1>
    <p>ОДИН МИР · МНОГО ВОЗМОЖНОСТЕЙ</p>
  </div>

  <div class="stage" id="stage">
    <div class="ring one"></div>
    <div class="ring two"></div>
    <div class="ring three"></div>
    <div class="axis"></div>
    <div class="axis vertical"></div>

    <button class="function f-map" data-id="map">
      <span class="symbol">◎</span>Карта мира
    </button>
    <button class="function f-market" data-id="market">
      <span class="symbol">◇</span>Товары
    </button>
    <button class="function f-services" data-id="services">
      <span class="symbol">⚙</span>Услуги
    </button>
    <button class="function f-work" data-id="work">
      <span class="symbol">▣</span>Работа
    </button>
    <button class="function f-delivery" data-id="delivery">
      <span class="symbol">⇢</span>Доставка
    </button>
    <button class="function f-learn" data-id="learn">
      <span class="symbol">⌘</span>Обучение
    </button>
    <button class="function f-business" data-id="business">
      <span class="symbol">▤</span>Бизнес
    </button>
    <button class="function f-ai" data-id="ai">
      <span class="symbol">✧</span>ИИ-помощник
    </button>

    <div class="core-position" id="corePosition">
      <div class="core-glow"></div>
      <div class="core" id="core" role="button" aria-label="Живое ядро">
        <div class="core-light"></div>
      </div>
    </div>
  </div>

  <p class="hint" id="hint">Нажми на ядро, чтобы открыть пространство возможностей</p>

  <form class="search" id="searchForm">
    <span class="search-icon">⌕</span>
    <input id="query" placeholder="Что ты ищешь в этом мире?" autocomplete="off">
    <button type="submit" aria-label="Поиск">➜</button>
  </form>

  <div class="city" id="cityLabel">⌖ Ош · Кыргызстан</div>
</main>

<footer>ONE PLANET · MANY POSSIBILITIES</footer>
</div>

<div class="overlay" id="overlay">
  <div class="dialog">
    <div class="dialog-head">
      <h2 id="dialogTitle">WORLD FIND</h2>
      <button class="close" id="close">×</button>
    </div>
    <div id="dialogContent"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
"use strict";

const stage = document.getElementById("stage");
const core = document.getElementById("core");
const overlay = document.getElementById("overlay");
const title = document.getElementById("dialogTitle");
const content = document.getElementById("dialogContent");
const hint = document.getElementById("hint");
const toast = document.getElementById("toast");
const buttons = [...document.querySelectorAll(".function")];

const data = {
  map:["Карта мира","Исследуй города, районы, места и точки на карте.",["🌍 Исследовать мир","📍 Места рядом","🏙 Города","🗺 Районы"]],
  market:["Товары и магазины","Поиск товаров, магазинов, поставщиков и предложений.",["🛍 Все товары","🏪 Магазины","📦 Предложения","🤝 Поставщики"]],
  services:["Услуги и специалисты","Находи специалистов и услуги в нужном месте.",["🔧 Мастера","🧹 Бытовые услуги","💻 Онлайн-услуги","👨‍🔧 Специалисты"]],
  work:["Работа и задания","Вакансии, задания, проекты и исполнители.",["💼 Вакансии","📝 Задания","🧑‍💻 Удалённая работа","🤝 Исполнители"]],
  delivery:["Доставка","Пространство заказов и доставки. Службы пока не подключены.",["🚚 Заказы","📍 Отслеживание","🏍 Курьеры","📦 Мои доставки"]],
  learn:["Обучение","Курсы, навыки, знания и наставники.",["📚 Курсы","🎓 Образование","🧠 Навыки","👨‍🏫 Наставники"]],
  business:["Бизнес","Компании, предприниматели и партнёры.",["🏢 Компании","🤝 Партнёры","📊 Инструменты","📣 Продвижение"]],
  ai:["ИИ-помощник","Помощь с поиском и выбором направления. ИИ-сервис подключается отдельно.",["✧ Помочь найти","✧ Сформировать запрос","✧ Подобрать направление","✧ Мои запросы"]]
};

let expanded = false;
let dragging = false;
let moved = false;
let startX = 0, startY = 0;
let dx = 0, dy = 0;
let city = "Ош";
let soundOn = false;
let toastTimer;

function notify(message) {
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"),2300);
}
function toggleSpace(force) {
  expanded = typeof force === "boolean" ? force : !expanded;
  stage.classList.toggle("open",expanded);
  hint.textContent = expanded
    ? "Перемести ядро к нужному направлению"
    : "Нажми на ядро, чтобы открыть пространство возможностей";
}
function highlight(id) {
  buttons.forEach(b => b.classList.toggle("active",b.dataset.id === id));
}
function detect(dx,dy) {
  const distance = Math.hypot(dx,dy);
  if(distance < 30) return null;
  const angle = (Math.atan2(-dy,dx)*180/Math.PI+360)%360;
  if(angle >= 67.5 && angle < 112.5) return "map";
  if(angle >= 22.5 && angle < 67.5) return "delivery";
  if(angle >= 337.5 || angle < 22.5) return "market";
  if(angle >= 247.5 && angle < 292.5) return "work";
  if(angle >= 202.5 && angle < 247.5) return "business";
  if(angle >= 157.5 && angle < 202.5) return "services";
  if(angle >= 112.5 && angle < 157.5) return "learn";
  return "ai";
}
function resetCore() {
  core.style.transform = "";
  core.classList.remove("dragging");
  dragging = false;
}
function openSection(id) {
  const item = data[id];
  if(!item) return;
  title.textContent = item[0];
  content.innerHTML = `
    <p class="description">${escapeHTML(item[1])}</p>
    <div class="items">
      ${item[2].map(x=>`<button class="item" type="button">${escapeHTML(x)}</button>`).join("")}
    </div>
    <p class="description" style="margin-top:17px">WORLD FIND · Раздел платформы</p>
  `;
  content.querySelectorAll(".item").forEach(button => {
    button.addEventListener("click",()=>notify("Этот подраздел будет подключён на следующем этапе"));
  });
  overlay.classList.add("show");
  toggleSpace(false);
  highlight(null);
}
function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

core.addEventListener("click",() => {
  if(!moved) toggleSpace();
});

core.addEventListener("pointerdown",event => {
  dragging = true;
  moved = false;
  startX = event.clientX;
  startY = event.clientY;
  dx = 0; dy = 0;
  core.classList.add("dragging");
  core.setPointerCapture(event.pointerId);
});

core.addEventListener("pointermove",event => {
  if(!dragging) return;
  dx = event.clientX-startX;
  dy = event.clientY-startY;
  if(Math.hypot(dx,dy)>9) moved = true;
  const max = 112;
  const length = Math.hypot(dx,dy);
  if(length>max) {
    dx *= max/length;
    dy *= max/length;
  }
  core.style.transform = `translate(${dx}px,${dy}px)`;
  const id = detect(dx,dy);
  highlight(id);
  if(id) hint.textContent = data[id][0]+" · отпусти ядро";
});

core.addEventListener("pointerup",() => {
  if(!dragging) return;
  const id = detect(dx,dy);
  resetCore();
  if(id) {
    openSection(id);
  } else if(moved) {
    highlight(null);
    hint.textContent = "Направление не выбрано. Попробуй ещё раз";
  }
  setTimeout(()=>{moved=false},100);
});
core.addEventListener("pointercancel",() => {
  resetCore();highlight(null);moved=false;
});

buttons.forEach(button => button.addEventListener("click",() => {
  openSection(button.dataset.id);
}));

document.getElementById("close").addEventListener("click",() => {
  overlay.classList.remove("show");
});
overlay.addEventListener("click",event => {
  if(event.target===overlay) overlay.classList.remove("show");
});

document.getElementById("more").addEventListener("click",() => {
  title.textContent = "Пространство системы";
  content.innerHTML = `
    <div class="items">
      <button class="item" data-menu="profile"><span>👤</span>Профиль</button>
      <button class="item" data-menu="messages"><span>💬</span>Сообщения</button>
      <button class="item" data-menu="settings"><span>⚙</span>Настройки</button>
      <button class="item" data-menu="about"><span>🌐</span>О проекте</button>
    </div>`;
  content.querySelectorAll("[data-menu]").forEach(b=>b.addEventListener("click",()=>notify("Раздел готовится к подключению")));
  overlay.classList.add("show");
});

document.getElementById("sound").addEventListener("click",event => {
  soundOn=!soundOn;
  event.currentTarget.textContent=soundOn?"♫":"♪";
  notify(soundOn?"Звуковой режим включён":"Звуковой режим выключен");
});

document.getElementById("location").addEventListener("click",() => {
  title.textContent="Местоположение";
  content.innerHTML=`
    <p class="description">Выбери город для поиска.</p>
    <input class="text-input" id="cityInput" value="${escapeHTML(city)}" placeholder="Город">
    <button class="action" id="saveCity">Сохранить город</button>
    <button class="action" id="detectCity">Определить местоположение</button>
    <p class="description" id="geoMessage"></p>`;
  overlay.classList.add("show");
  document.getElementById("saveCity").addEventListener("click",()=>{
    const value=document.getElementById("cityInput").value.trim();
    if(!value)return;
    city=value;
    document.getElementById("cityLabel").textContent="⌖ "+city;
    overlay.classList.remove("show");
    notify("Город изменён: "+city);
  });
  document.getElementById("detectCity").addEventListener("click",()=>{
    const message=document.getElementById("geoMessage");
    if(!navigator.geolocation){message.textContent="Геолокация недоступна в этом браузере.";return}
    message.textContent="Ожидаем разрешение на доступ к местоположению…";
    navigator.geolocation.getCurrentPosition(
      p=>message.textContent="Координаты получены. Для названия города понадобится картографический сервис.",
      ()=>message.textContent="Доступ к местоположению не предоставлен."
    );
  });
});

const demo=[
  ["Бананы","Товар","Ош","120 сом/кг"],
  ["Домашние яблоки","Товар","Ош","90 сом/кг"],
  ["Ремонт телефона","Услуга","Ош","от 500 сом"],
  ["Настольная лампа","Товар","Бишкек","1 200 сом"],
  ["Сумка","Товар","Бишкек","850 сом"]
];

document.getElementById("searchForm").addEventListener("submit",event=>{
  event.preventDefault();
  const q=document.getElementById("query").value.trim();
  if(!q){notify("Напиши, что хочешь найти");return}
  const matches=demo.filter(x=>x.join(" ").toLowerCase().includes(q.toLowerCase()));
  title.textContent="Результаты поиска";
  content.innerHTML=`
    <p class="description">Запрос: ${escapeHTML(q)}</p>
    ${matches.length?matches.map(x=>`
      <div class="description" style="padding:12px 0;border-bottom:1px solid #29435f">
        <strong>${escapeHTML(x[0])}</strong>
        <br><small>${escapeHTML(x[1])} · ${escapeHTML(x[2])} · ${escapeHTML(x[3])}</small>
      </div>`).join(""):`
      <p class="description">В демонстрационных данных совпадений нет. Общая база объявлений будет подключена отдельно.</p>`}`;
  overlay.classList.add("show");
});

})();
</script>
