
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050a16">
<title>WORLD FIND — Gesture Core</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;overflow:hidden;height:100dvh;
 background:radial-gradient(ellipse at 50% 45%,#10264b,#050a16 65%);
 color:white;font-family:Arial,sans-serif;
 touch-action:pan-y;
}
#app{height:100%;position:relative;overflow:hidden}
.map{
 position:absolute;inset:0;opacity:.23;
 background-image:
 linear-gradient(rgba(60,150,255,.13) 1px,transparent 1px),
 linear-gradient(90deg,rgba(60,150,255,.13) 1px,transparent 1px);
 background-size:42px 42px;
}
.top{
 position:absolute;top:25px;width:100%;text-align:center;
 letter-spacing:4px;font-size:12px;color:#80caff;
}
.subtitle{
 margin-top:9px;font-size:9px;letter-spacing:2px;
 color:#8299bb;
}
.status{
 position:absolute;top:100px;width:100%;
 text-align:center;font-size:10px;letter-spacing:2px;
 color:#8ca9ce;
}
#core{
 position:absolute;left:50%;top:51%;
 transform:translate(-50%,-50%);
 width:116px;height:116px;border-radius:50%;
 border:1px solid #65caff;
 background:radial-gradient(circle at 38% 32%,#b7f4ff,#238ce5 28%,#09285c 65%,#030a1b);
 box-shadow:0 0 25px #168dff,0 0 65px #0877ff80,inset 0 0 25px #a4eaff80;
 display:flex;align-items:center;justify-content:center;
 z-index:5;cursor:pointer;touch-action:none;
 user-select:none;
}
#core:before{
 content:"";position:absolute;inset:-12px;border-radius:50%;
 border:1px solid #4db9ff70;
 animation:pulse 3s infinite;
}
#core:after{
 content:"";position:absolute;inset:-23px;border-radius:50%;
 border:1px solid #4db9ff30;
 animation:pulse 3s infinite 1s;
}
.core-text{
 text-align:center;font-size:11px;font-weight:bold;
 letter-spacing:2px;text-shadow:0 0 12px white;
 pointer-events:none;
}
@keyframes pulse{
 0%,100%{transform:scale(.94);opacity:.3}
 50%{transform:scale(1.12);opacity:1}
}
#menu{position:absolute;inset:0;pointer-events:none;z-index:4}
.option{
 position:absolute;left:50%;top:51%;
 width:88px;min-height:58px;
 transform:translate(-50%,-50%) scale(.4);
 opacity:0;pointer-events:none;
 border:1px solid #397dbb;
 border-radius:14px;
 background:linear-gradient(145deg,#10294b,#071326);
 color:#d8edff;
 display:flex;flex-direction:column;
 align-items:center;justify-content:center;gap:5px;
 font-size:10px;letter-spacing:.5px;
 box-shadow:0 0 15px #087bff30;
 transition:opacity .2s,transform .2s,background .2s;
 cursor:pointer;
}
.option .ico{font-size:21px}
#app.open .option{
 opacity:1;pointer-events:auto;
 transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1);
}
.option.active{
 border:1px solid #8ceaff;
 background:linear-gradient(145deg,#1768a8,#0a2850);
 box-shadow:0 0 25px #19aaff, inset 0 0 15px #49baff60;
 color:white;
 transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.13)!important;
}
#hint{
 position:absolute;top:calc(51% + 95px);
 width:100%;text-align:center;
 font-size:10px;letter-spacing:1px;color:#83a9d2;
 pointer-events:none;
}
#search{
 position:absolute;bottom:27px;left:6%;width:88%;
 height:52px;border-radius:30px;
 border:1px solid #31618d;
 background:#0a1930eF;
 display:flex;align-items:center;padding:0 17px;gap:10px;
 box-shadow:0 0 25px #006eff25;
}
#search span{font-size:19px;color:#6fcaff}
#search input{
 flex:1;min-width:0;background:none;border:0;outline:0;
 color:white;font-size:14px;
}
#search input::placeholder{color:#8297b4}
#result{
 position:absolute;inset:0;background:#050b18;
 z-index:10;display:none;padding:30px 22px;
}
#result.show{display:block}
#result h2{color:#75caff;font-size:23px}
#result p{color:#a9bed8;line-height:1.6}
.back{
 border:1px solid #398ac7;background:#10294a;color:white;
 padding:12px 20px;border-radius:20px;margin-top:20px;
}
#close{
 position:absolute;top:24px;right:22px;
 color:#8fcfff;background:none;border:0;font-size:23px;
 display:none;z-index:8;
}
#app.open #close{display:block}
</style>
</head>
<body>
<div id="app">
 <div class="map"></div>

 <header class="top">
  WORLD FIND
  <div class="subtitle">ONE PLANET · MANY POSSIBILITIES</div>
 </header>

 <div class="status" id="status">СИСТЕМА АКТИВНА</div>

 <div id="menu">
  <button class="option" data-name="Карта" data-icon="🌍"><span class="ico">🌍</span>КАРТА</button>
  <button class="option" data-name="Поиск" data-icon="🔎"><span class="ico">🔎</span>ПОИСК</button>
  <button class="option" data-name="Товары" data-icon="🛍️"><span class="ico">🛍️</span>ТОВАРЫ</button>
  <button class="option" data-name="Услуги" data-icon="🛠️"><span class="ico">🛠️</span>УСЛУГИ</button>
  <button class="option" data-name="Работа" data-icon="💼"><span class="ico">💼</span>РАБОТА</button>
  <button class="option" data-name="Общение" data-icon="💬"><span class="ico">💬</span>ОБЩЕНИЕ</button>
  <button class="option" data-name="Доставка" data-icon="🚚"><span class="ico">🚚</span>ДОСТАВКА</button>
  <button class="option" data-name="Профиль" data-icon="👤"><span class="ico">👤</span>ПРОФИЛЬ</button>
 </div>

 <button id="core" aria-label="Открыть меню">
  <span class="core-text">WORLD<br>CORE</span>
 </button>

 <div id="hint">УДЕРЖИВАЙ ЯДРО И ВЫБЕРИ НАПРАВЛЕНИЕ</div>
 <button id="close">✕</button>

 <div id="search">
  <span>⌕</span>
  <input id="query" placeholder="Что ты ищешь в этом мире?">
 </div>

 <section id="result">
  <button class="back" onclick="goHome()">← Назад к ядру</button>
  <h2 id="resultTitle">КАРТА</h2>
  <p id="resultText">Пространство выбранной функции WORLD FIND.</p>
 </section>
</div>

<script>
const app=document.getElementById("app");
const core=document.getElementById("core");
const options=[...document.querySelectorAll(".option")];
const hint=document.getElementById("hint");
const status=document.getElementById("status");
const result=document.getElementById("result");
const resultTitle=document.getElementById("resultTitle");
const resultText=document.getElementById("resultText");
const closeBtn=document.getElementById("close");

let selected=null;
let opened=false;
let startX=0,startY=0;
let moved=false;
let pointerDown=false;

function arrange(){
 const radius=Math.min(window.innerWidth*.34,145);
 options.forEach((el,i)=>{
  const angle=(-90+i*45)*Math.PI/180;
  el.style.setProperty("--x",(Math.cos(angle)*radius)+"px");
  el.style.setProperty("--y",(Math.sin(angle)*radius)+"px");
 });
}
arrange();
window.addEventListener("resize",arrange);

function openMenu(){
 opened=true;
 app.classList.add("open");
 hint.textContent="ПЕРЕМЕЩАЙ ПАЛЕЦ К НУЖНОЙ ФУНКЦИИ";
 status.textContent="ВЫБЕРИ НАПРАВЛЕНИЕ";
}
function closeMenu(){
 opened=false;
 app.classList.remove("open");
 options.forEach(o=>o.classList.remove("active"));
 selected=null;
 hint.textContent="УДЕРЖИВАЙ ЯДРО И ВЫБЕРИ НАПРАВЛЕНИЕ";
 status.textContent="СИСТЕМА АКТИВНА";
}
function choose(el){
 const name=el.dataset.name;
 resultTitle.textContent=name.toUpperCase();
 resultText.textContent="Раздел «"+name+"» выбран. Здесь будет размещена полноценная функция WORLD FIND. Сейчас это демонстрационная область.";
 result.classList.add("show");
 closeMenu();
}
function highlight(el){
 options.forEach(o=>o.classList.toggle("active",o===el));
 selected=el;
 if(el){
  status.textContent="ВЫБРАНО: "+el.dataset.name.toUpperCase();
  hint.textContent="ОТПУСТИ ПАЛЕЦ, ЧТОБЫ ОТКРЫТЬ";
 }else{
  status.textContent="ВЫБЕРИ НАПРАВЛЕНИЕ";
  hint.textContent="ПЕРЕМЕЩАЙ ПАЛЕЦ К НУЖНОЙ ФУНКЦИИ";
 }
}
function findOption(x,y){
 const cx=window.innerWidth/2;
 const cy=window.innerHeight*.51;
 const dx=x-cx,dy=y-cy;
 const distance=Math.hypot(dx,dy);
 if(distance<48||distance>Math.min(window.innerWidth*.48,205))return null;
 let angle=Math.atan2(dy,dx)*180/Math.PI;
 if(angle< -90)angle+=360;
 let index=Math.round((angle+90)/45)%8;
 return options[index];
}

core.addEventListener("pointerdown",e=>{
 e.preventDefault();
 pointerDown=true;
 moved=false;
 startX=e.clientX;
 startY=e.clientY;
 openMenu();
 core.setPointerCapture(e.pointerId);
});
core.addEventListener("pointermove",e=>{
 if(!pointerDown)return;
 const distance=Math.hypot(e.clientX-startX,e.clientY-startY);
 if(distance>18)moved=true;
 if(moved)highlight(findOption(e.clientX,e.clientY));
});
core.addEventListener("pointerup",e=>{
 if(!pointerDown)return;
 pointerDown=false;
 if(selected){
  choose(selected);
 }else{
  hint.textContent="ПРОВЕДИ ПАЛЬЦЕМ ОТ ЯДРА К НУЖНОМУ НАПРАВЛЕНИЮ";
 }
});
core.addEventListener("pointercancel",()=>{
 pointerDown=false;
 if(!selected)closeMenu();
});

options.forEach(el=>{
 el.addEventListener("click",()=>choose(el));
});
closeBtn.addEventListener("click",closeMenu);

function goHome(){
 result.classList.remove("show");
 closeMenu();
}
window.goHome=goHome;

document.getElementById("query").addEventListener("keydown",e=>{
 if(e.key==="Enter"){
  const value=e.target.value.trim();
  if(!value)return;
  resultTitle.textContent="ПОИСК";
  resultText.textContent='Запрос: "'+value+'". В этой версии поиск пока демонстрационный. Позже подключим настоящую базу предложений.';
  result.classList.add("show");
 }
});
</script>
</body>
</html>
