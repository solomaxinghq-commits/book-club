<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#060914">
<title>WORLD FIND 3.0 — Живое ядро</title>
<style>
:root{--bg:#060914;--panel:rgba(11,20,43,.88);--line:rgba(104,225,255,.24);--cyan:#61f3ff;--blue:#6b83ff;--text:#eef8ff;--muted:#91a6c7;--pink:#ff6bd6}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}body{overflow:hidden}button,input,select{font:inherit}button{cursor:pointer;color:inherit}.app{height:100dvh;min-height:560px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#12264b 0,#070d20 48%,#040711 100%)}#stars{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.8}.top{position:absolute;z-index:5;top:12px;left:12px;right:12px;display:flex;gap:9px;align-items:center}.brand{font-size:13px;letter-spacing:2px;font-weight:900;white-space:nowrap;color:#e8fbff;text-shadow:0 0 16px #4ceeff}.brand span{display:block;font-size:9px;letter-spacing:3px;color:var(--cyan);margin-top:3px}.search{flex:1;min-width:0;display:flex;gap:7px;padding:7px;border:1px solid var(--line);border-radius:16px;background:rgba(6,14,32,.88);backdrop-filter:blur(14px);box-shadow:0 0 25px #1bdcff12}.search input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font-size:14px;padding:5px}.search input::placeholder{color:#8295b4}.glass{border:0;border-radius:11px;background:linear-gradient(135deg,#61f3ff,#7d8cff);color:#061021;font-weight:900;padding:9px 12px}.pill{border:1px solid var(--line);border-radius:14px;background:#0a1530cc;padding:10px 12px;color:var(--cyan);font-size:12px}.status{position:absolute;top:82px;left:14px;z-index:3;color:#8ca9ce;font-size:10px;letter-spacing:1.6px}.status b{color:#65f5d1;font-weight:700}.globe-wrap{position:absolute;inset:80px 0 145px;display:grid;place-items:center;perspective:900px;pointer-events:none}.orbit{width:min(77vw,390px);aspect-ratio:1;border-radius:50%;position:relative;transform-style:preserve-3d;animation:float 7s ease-in-out infinite}.orbit:before,.orbit:after{content:"";position:absolute;inset:-7%;border:1px solid #60e9ff40;border-radius:50%;transform:rotateX(70deg);box-shadow:0 0 25px #39dfff13}.orbit:after{inset:-17%;transform:rotateY(70deg) rotateX(15deg);border-color:#9a76ff30}.earth{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 32% 28%,#5df7ff 0,#277ca6 8%,#0b3b6e 27%,#08152e 64%,#020611 100%);box-shadow:inset -25px -20px 50px #01040d,inset 10px 8px 30px #77f6ff65,0 0 35px #28cfff50,0 0 90px #266dff22;transform:rotateY(-18deg)}.earth:before{content:"";position:absolute;inset:-10%;background:repeating-linear-gradient(0deg,transparent 0 22px,#4ff4ff36 23px 24px),repeating-linear-gradient(90deg,transparent 0 22px,#4ff4ff30 23px 24px);border-radius:50%;mask-image:radial-gradient(circle,#000 48%,transparent 70%);animation:gridmove 18s linear infinite}.land{position:absolute;inset:0;opacity:.85;background:radial-gradient(ellipse at 32% 33%,#8fffc3 0 5%,transparent 5.8%),radial-gradient(ellipse at 37% 39%,#6be5a0 0 9%,transparent 9.8%),radial-gradient(ellipse at 58% 32%,#a3ffbd 0 6%,transparent 6.8%),radial-gradient(ellipse at 62% 42%,#7bf5a4 0 12%,transparent 12.8%),radial-gradient(ellipse at 75% 62%,#75e7a0 0 8%,transparent 8.8%),radial-gradient(ellipse at 28% 65%,#7be9a7 0 9%,transparent 9.8%);filter:drop-shadow(0 0 7px #54ffbf);transform:rotate(-14deg);animation:landmove 18s linear infinite}.equator{position:absolute;inset:25% -12%;border:1px solid #67f4ff60;border-radius:50%;transform:rotate(-19deg);box-shadow:0 0 18px #59eaff22}.node{position:absolute;width:8px;height:8px;border-radius:50%;background:#a3ffff;box-shadow:0 0 10px 4px #39eaff88;animation:blink 2s infinite}.node.n1{left:35%;top:34%}.node.n2{left:65%;top:43%;animation-delay:.6s}.node.n3{left:53%;top:64%;animation-delay:1.1s}.node.n4{left:25%;top:58%;animation-delay:1.5s}.planet-label{position:absolute;left:50%;top:calc(50% + min(38vw,190px));transform:translateX(-50%);font-size:10px;letter-spacing:4px;color:#83cfff;white-space:nowrap;text-shadow:0 0 12px #1bdfff}.map-hint{position:absolute;z-index:2;bottom:145px;left:0;right:0;text-align:center;font-size:11px;color:#7892b8;letter-spacing:.5px}.core-area{position:absolute;z-index:8;bottom:26px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px}.core{width:76px;height:76px;border:1px solid #9afaff;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e4ffff,#45e7ff 18%,#1766b8 43%,#0a1230 72%);box-shadow:0 0 18px #35eaff,0 0 48px #2c8fff70,inset 0 0 18px #b9ffff;display:grid;place-items:center;color:#fff;font-size:24px;position:relative;animation:pulse 3s ease-in-out infinite}.core:before{content:"";position:absolute;inset:-9px;border:1px solid #5cecff70;border-radius:50%;animation:ring 4s linear infinite}.core-label{font-size:9px;letter-spacing:3px;color:var(--cyan);text-shadow:0 0 10px #39eaff}.menu{position:absolute;z-index:7;bottom:125px;left:50%;transform:translate(-50%,15px) scale(.96);width:min(92vw,390px);display:grid;grid-template-columns:repeat(2,1fr);gap:8px;opacity:0;pointer-events:none;transition:.22s}.menu.open{opacity:1;pointer-events:auto;transform:translate(-50%,0) scale(1)}.menu button{background:rgba(9,21,47,.95);border:1px solid #4cdffb4d;border-radius:16px;text-align:left;padding:13px;box-shadow:0 8px 28px #0006;backdrop-filter:blur(12px)}.menu strong{display:block;font-size:13px}.menu small{display:block;color:var(--muted);font-size:10px;margin-top:5px}.panel{position:absolute;z-index:10;left:12px;right:12px;top:120px;max-height:calc(100% - 270px);overflow:auto;border:1px solid var(--line);border-radius:22px;background:var(--panel);backdrop-filter:blur(20px);padding:16px;box-shadow:0 20px 60px #0008;display:none}.panel.show{display:block}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.panel h2{font-size:17px;margin:0}.close{border:1px solid var(--line);background:#101f3c;border-radius:10px;padding:7px 10px}.muted{font-size:12px;color:var(--muted);line-height:1.5}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.item{border:1px solid #70dfff25;background:#0a1731;border-radius:15px;padding:12px;min-width:0}.item .emoji{font-size:23px}.item h3{font-size:13px;margin:7px 0 4px}.price{font-size:14px;color:#72ffe1;font-weight:800}.item p{font-size:11px;color:var(--muted);margin:5px 0 10px;line-height:1.4}.smallbtn{border:1px solid #62eaff55;border-radius:10px;background:#0e2944;padding:8px 10px;font-size:11px;color:#8ef7ff;width:100%}.form{display:grid;gap:9px}.field{width:100%;border:1px solid #5cdcfb35;background:#061126;color:#f2fbff;border-radius:12px;padding:12px;outline:0}.form .glass{width:100%}.notice{font-size:10px;color:#8399ba;line-height:1.5;margin-top:12px}.toast{position:absolute;z-index:20;left:50%;bottom:118px;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:#102646;border:1px solid #62eaff70;border-radius:13px;padding:10px 14px;font-size:12px;max-width:90%;text-align:center;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.bottom-info{position:absolute;z-index:2;bottom:10px;left:12px;font-size:9px;color:#52698e;letter-spacing:.5px}.results{display:grid;gap:8px;margin-top:12px}.result{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px;border:1px solid #5fe8ff2b;border-radius:12px;background:#0b1934}.result b{font-size:12px}.result span{font-size:11px;color:#78f5df}@keyframes float{0%,100%{transform:translateY(0) rotateZ(-2deg)}50%{transform:translateY(-9px) rotateZ(2deg)}}@keyframes pulse{0%,100%{box-shadow:0 0 18px #35eaff,0 0 48px #2c8fff70,inset 0 0 18px #b9ffff}50%{box-shadow:0 0 28px #35eaff,0 0 70px #2c8fff90,inset 0 0 25px #fff}}@keyframes ring{to{transform:rotate(360deg)}}@keyframes blink{0%,100%{opacity:.45;transform:scale(.7)}50%{opacity:1;transform:scale(1.2)}}@keyframes gridmove{to{transform:translateX(24px)}}@keyframes landmove{to{transform:rotate(-14deg) translateX(7px)}}@media(min-width:700px){.top{left:24px;right:24px;top:20px}.brand{font-size:16px}.globe-wrap{inset:70px 0 110px}.orbit{width:min(42vw,450px)}.panel{left:auto;right:24px;top:105px;width:370px;max-height:calc(100% - 200px)}.status{top:88px;left:26px}.map-hint{bottom:100px}.core-area{bottom:20px}.menu{bottom:115px}.bottom-info{left:24px;bottom:18px}}@media(max-height:650px){.globe-wrap{inset:78px 0 110px}.orbit{width:min(62vw,290px)}.planet-label{top:calc(50% + min(31vw,145px))}.map-hint{bottom:110px}.core-area{bottom:10px}.core{width:62px;height:62px}.menu{bottom:95px}.panel{top:95px;max-height:calc(100% - 190px)}}
</style>
</head>
<body>
<div class="app">
<canvas id="stars"></canvas>
<header class="top">
  <div class="brand">WORLD FIND<span>ЖИВОЕ ЯДРО · 3.0</span></div>
  <form class="search" id="searchForm"><input id="searchInput" autocomplete="off" placeholder="Найти город, товар, услугу…" aria-label="Поиск"><button class="glass" aria-label="Искать">⌕</button></form>
  <button class="pill" id="cityBtn">⌖ <span id="cityName">Ош</span></button>
</header>
<div class="status"><b>● СИСТЕМА АКТИВНА</b> &nbsp; / &nbsp; DEMO MODE</div>
<main class="globe-wrap" aria-label="Анимированная цифровая планета">
  <div class="orbit"><div class="earth"><div class="land"></div><div class="equator"></div><i class="node n1"></i><i class="node n2"></i><i class="node n3"></i><i class="node n4"></i></div></div>
  <div class="planet-label">ONE PLANET · MANY POSSIBILITIES</div>
</main>
<div class="map-hint">ИССЛЕДУЙ · ИЩИ · ОТКРЫВАЙ</div>
<div class="menu" id="menu">
  <button data-panel="explore"><strong>🌍 Исследовать</strong><small>Города и категории</small></button>
  <button data-panel="search"><strong>⌕ Поиск</strong><small>Товары и услуги</small></button>
  <button data-panel="publish"><strong>＋ Разместить</strong><small>Новое объявление</small></button>
  <button data-panel="profile"><strong>◉ Профиль</strong><small>Демо-пользователь</small></button>
</div>
<div class="panel" id="panel"><div class="panel-head"><h2 id="panelTitle">WORLD FIND</h2><button class="close" id="closePanel">Закрыть ✕</button></div><div id="panelBody"></div></div>
<div class="toast" id="toast"></div>
<div class="core-area"><button class="core" id="core" aria-label="Открыть главное меню">✦</button><div class="core-label">ОТКРЫТЬ ЯДРО</div></div>
<div class="bottom-info">WORLD FIND 3.0 · ИНТЕРАКТИВНЫЙ ПРОТОТИП</div>
</div>
<script>
(()=>{
const $=s=>document.querySelector(s);
const menu=$('#menu'),panel=$('#panel'),body=$('#panelBody'),title=$('#panelTitle'),toast=$('#toast');
let city='Ош',listings=[
 {name:'Бананы',category:'Продукты',price:'120 сом / кг',city:'Ош',emoji:'🍌',description:'Демо-объявление · цена примерная'},
 {name:'Домашние яблоки',category:'Продукты',price:'90 сом / кг',city:'Ош',emoji:'🍎',description:'Демо-объявление · наличие не проверено'},
 {name:'Ремонт телефона',category:'Услуги',price:'от 500 сом',city:'Ош',emoji:'📱',description:'Пример услуги'},
 {name:'Настольная лампа',category:'Товары',price:'1 200 сом',city:'Бишкек',emoji:'💡',description:'Демо-объявление · наличие не проверено'},
 {name:'Сумка',category:'Товары',price:'850 сом',city:'Бишкек',emoji:'👜',description:'Пример объявления'}
];
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function say(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>toast.classList.remove('show'),2500)}
function openPanel(which){menu.classList.remove('open');panel.classList.add('show');render(which)}
function closePanel(){panel.classList.remove('show')}
function render(which){
 let html='';
 if(which==='explore'){title.textContent='Исследовать мир';html=`<p class="muted">Выбери направление. Карточки ниже — демонстрационные данные, а не подтверждённые предложения.</p><div class="cards"><button class="item" data-category="Продукты"><div class="emoji">🥑</div><h3>Продукты</h3><p>Еда и товары на каждый день</p></button><button class="item" data-category="Товары"><div class="emoji">🛍️</div><h3>Товары</h3><p>Вещи и находки</p></button><button class="item" data-category="Услуги"><div class="emoji">🛠️</div><h3>Услуги</h3><p>Помощь рядом</p></button><button class="item" data-category="Все"><div class="emoji">✨</div><h3>Всё сразу</h3><p>Все категории</p></button></div><div class="results" id="results"></div>`}
 else if(which==='search'){title.textContent='Умный поиск';html=`<p class="muted">Ищи по названию, категории или городу. Результаты пока хранятся только в этом браузере.</p><form id="insideSearch" class="form"><input class="field" id="insideQuery" placeholder="Например: бананы, ремонт, Ош"><button class="glass">Найти</button></form><div class="results" id="results"></div>`}
 else if(which==='publish'){title.textContent='Новое объявление';html=`<p class="muted">Создай тестовое объявление. Оно сохранится на этом устройстве в браузере, но другие пользователи его не увидят.</p><form class="form" id="publishForm"><input class="field" name="name" placeholder="Что предлагаешь?" maxlength="70" required><select class="field" name="category"><option>Продукты</option><option>Товары</option><option>Услуги</option></select><input class="field" name="price" placeholder="Цена, например 120 сом" maxlength="45" required><input class="field" name="city" placeholder="Город" maxlength="40" value="${escapeHTML(city)}" required><input class="field" name="emoji" placeholder="Эмодзи (необязательно)" maxlength="8"><textarea class="field" name="description" placeholder="Короткое описание" maxlength="180" rows="2" style="resize:vertical"></textarea><button class="glass">Сохранить объявление</button></form>`}
 else if(which==='profile'){title.textContent='Профиль';html=`<div class="item"><div class="emoji">👤</div><h3>Гость WORLD FIND</h3><p>Демонстрационный профиль без регистрации.</p><div class="price">${listings.length} объявлений в текущей демо-сессии</div></div><p class="muted">Вход, пароль, синхронизация между устройствами и настоящие пользовательские аккаунты пока не подключены.</p><button class="smallbtn" id="showListings">Мои объявления на этом устройстве</button><div class="results" id="results"></div>`}
 else if(which==='results'){title.textContent='Результаты поиска';html=`<div class="results" id="results"></div>`}
 body.innerHTML=html;
 if(which==='explore'){body.querySelectorAll('[data-category]').forEach(b=>b.addEventListener('click',()=>showResults(b.dataset.category)))}
 if(which==='search'){$('#insideSearch').addEventListener('submit',e=>{e.preventDefault();showResults($('#insideQuery').value)})}
 if(which==='publish'){$('#publishForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.currentTarget);const item={name:f.get('name').trim(),category:f.get('category'),price:f.get('price').trim(),city:f.get('city').trim(),emoji:f.get('emoji').trim()||'📦',description:f.get('description').trim()||'Объявление пользователя'};listings.unshift(item);try{localStorage.setItem('wf3-listings',JSON.stringify(listings))}catch(_){}say('Объявление сохранено на этом устройстве');render('results');showResults('Все')})}
 if(which==='profile'){$('#showListings').addEventListener('click',()=>showResults('Мои объявления'))}
 if(which==='results')showResults('Все');
}
function card(x){return `<article class="item"><div class="emoji">${escapeHTML(x.emoji||'📦')}</div><h3>${escapeHTML(x.name)}</h3><div class="price">${escapeHTML(x.price)}</div><p>${escapeHTML(x.category)} · ${escapeHTML(x.city)}<br>${escapeHTML(x.description||'')}</p><button class="smallbtn" data-contact="${escapeHTML(x.name)}">Подробнее</button></article>`}
function showResults(query){
 let q=String(query||'Все').trim().toLowerCase(),arr=listings;
 if(q==='мои объявления')arr=listings.filter(x=>x.userMade);
 else if(q&&q!=='все'&&q!=='всё сразу')arr=listings.filter(x=>[x.name,x.category,x.city,x.description].join(' ').toLowerCase().includes(q));
 const target=$('#results');if(!target){render('results');return}
 target.innerHTML=arr.length?`<div class="cards">${arr.map(card).join('')}</div>`:`<p class="muted">Ничего не найдено. Попробуй другое слово.</p>`;
 target.querySelectorAll('[data-contact]').forEach(b=>b.addEventListener('click',()=>say('Это демо-карточка. Контакты и заказы ещё не подключены.')));
}
function doSearch(q){if(!q.trim()){say('Введи название товара, услуги или города');return}openPanel('results');const t=$('#results');if(t){const val=q.trim().toLowerCase();const arr=listings.filter(x=>[x.name,x.category,x.city,x.description].join(' ').toLowerCase().includes(val));t.innerHTML=arr.length?`<div class="cards">${arr.map(card).join('')}</div>`:`<p class="muted">По запросу «${escapeHTML(q)}» пока ничего не найдено.</p>`;t.querySelectorAll('[data-contact]').forEach(b=>b.addEventListener('click',()=>say('Демо-карточка: заказы не подключены.')))}}
$('#core').addEventListener('click',()=>menu.classList.toggle('open'));
menu.querySelectorAll('[data-panel]').forEach(b=>b.addEventListener('click',()=>openPanel(b.dataset.panel)));
$('#closePanel').addEventListener('click',closePanel);
$('#searchForm').addEventListener('submit',e=>{e.preventDefault();doSearch($('#searchInput').value)});
$('#cityBtn').addEventListener('click',()=>{city=city==='Ош'?'Бишкек':'Ош';$('#cityName').textContent=city;say('Выбран город: '+city);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){menu.classList.remove('open');closePanel()}});
try{const saved=JSON.parse(localStorage.getItem('wf3-listings')||'null');if(Array.isArray(saved))listings=saved.concat(listings.filter(x=>!saved.some(y=>y.name===x.name&&y.city===x.city)));}catch(_){}
const canvas=$('#stars'),ctx=canvas.getContext('2d');let stars=[];
function resize(){const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.floor(innerWidth*dpr);canvas.height=Math.floor(innerHeight*dpr);canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:Math.min(150,Math.floor(innerWidth*innerHeight/6000))},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.4+.25,a:Math.random()*.65+.15,s:Math.random()*.18+.03}))}
function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);for(const s of stars){s.y-=s.s;if(s.y<0){s.y=innerHeight;s.x=Math.random()*innerWidth}ctx.globalAlpha=s.a*(.7+.3*Math.sin(Date.now()/900+s.x));ctx.fillStyle='#a8f6ff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;requestAnimationFrame(draw)}
addEventListener('resize',resize);resize();draw();
})();
</script>
</body>
</html>
